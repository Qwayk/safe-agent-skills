[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwayk-sav-safe-agent-cli"
version = "0.1.4"
description = "SAV Domain APIs v1 inventory generator and runtime command ledger."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "coverage>=7.0.0",
  "mypy>=1.10.0",
  "ruff>=0.6.0",
  "types-requests>=2.32.0",
]

[project.scripts]
sav = "sav_domain_api.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
  ".venv",
  "build",
  "dist",
  "src/**.egg-info",
  "src/sav_domain_api/operations_generated.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = ["E501", "RUF017"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
show_error_codes = true
pretty = false
exclude = "(^\\.venv/|^build/|^dist/|^src/.*\\.egg-info/)"

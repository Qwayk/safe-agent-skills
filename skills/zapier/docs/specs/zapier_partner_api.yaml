            * `MULTILINE` - MULTILINE
            * `PASSWORD` - PASSWORD
            * `CODE` - CODE
            * `READONLY` - READONLY
            * `FILE` - FILE
            * `SELECT` - SELECT
        invalidates_input_fields:
          type: boolean
          description: Whether this Input Field invalidates
        is_required:
          type: boolean
          description: Whether this Input Field is required
        items:
          type: object
          additionalProperties:
            type: string
          description: A freeform object of items for this Input Field
        placeholder:

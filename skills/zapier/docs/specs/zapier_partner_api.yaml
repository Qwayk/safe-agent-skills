      properties:
        type:
          type: string
          readOnly: true
          description: The type of Input Field
        id:
          type: string
          description: The identifier for this Input Field
        default_value:
          type: string
          description: The default value for this Input Field if not otherwise specified
        depends_on:
          type: array
          items:
